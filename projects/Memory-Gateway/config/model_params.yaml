categories:
  # 分类系数（乘在模型基线上）
  realtime:
    temp_coef: 0.4
    top_p_coef: 0.9
    note: "实时数据要精确"

  factual:
    temp_coef: 0.5
    top_p_coef: 0.95
    note: "事实类要准确"

  howto:
    temp_coef: 0.8
    top_p_coef: 1.0
    note: "操作类要清晰"

  compare:
    temp_coef: 1.0
    top_p_coef: 1.0
    note: "对比类要灵活"

  unanswerable:
    temp_coef: 0.4
    top_p_coef: 0.9
    note: "拒答要稳定"


safety:
  # 安全边界（超出则 clamp）
  temp_min: 0.0
  temp_max: 1.2
  top_p_min: 0.5
  top_p_max: 1.0
  top_k_min: 1
  top_k_max: 100
  rp_min: 1.0
  rp_max: 1.3
