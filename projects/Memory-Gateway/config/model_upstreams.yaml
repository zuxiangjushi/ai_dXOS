    port: 8003
  - model: qwen3_32b
  - model: yy35b_q6
    port: 8001
  - model: qwen38_27b_f8
    port: 8002
  - model: gemma_4
    port: 8004
  - model: yy38_27b
    port: 8005
  - model: yy35b_q6
    port: 8006
  - model: 38FN_Q4
