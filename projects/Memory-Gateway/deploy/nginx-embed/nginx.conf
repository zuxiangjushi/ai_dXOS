events { worker_connections 1024; }

http {
    server {
        listen 0.0.0.0:3101;      # ★ 监听所有网卡，容器才能访问
        client_max_body_size 50m;

        # OpenAI 兼容路径 → Infinity 原生路径
        location /v1/embeddings {
            proxy_pass http://192.168.10.132:8003/embeddings;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
            proxy_read_timeout 60s;
        }

        location /v1/models {
            add_header Content-Type application/json;
            return 200 '{"object":"list","data":[{"id":"models/bge-m3","object":"model"}]}';
        }

        location / {
            proxy_pass http://192.168.10.132:8003;
        }
    }
}
