SGLANG_START_TEMPLATE='docker run -d \
    --gpus all \
    -v /ai/ai_dxos/volumes/models:/models:ro \
    --shm-size 16g \
    -e CUDA_VISIBLE_DEVICES={GPU_IDS} \
    -e CUDA_DISABLE_P2P=1 \
    -e NCCL_P2P_DISABLE=1 \
    -e NCCL_IB_DISABLE=1 \
    -e NCCL_DEBUG=INFO \
    -e SGLANG_DISABLE_TORCHCODEC=1 \
    --ipc=host \
    -p {PORT}:{PORT} \
    --name {CONTAINER_NAME} \
    lmsysorg/sglang:v0.5.17-cu130-runtime \
    python3 -m sglang.launch_server \
    --model-path /models/{PHYSICAL_MODEL} \
    --served-model-name {API_NAME} \
    --port {PORT} \
    --host 0.0.0.0 \
    --tp 2 \
    --trust-remote-code \
    --mem-fraction-static 0.82 \
    --context-length 32768 \
    --disable-custom-all-reduce'

SGLANG_STOP_CMD='docker stop {CONTAINER_NAME} && docker rm {CONTAINER_NAME}'

LLAMA_CPP_START_TEMPLATE='docker run -d \
    --gpus all \
    --runtime=nvidia \
    -e CUDA_VISIBLE_DEVICES={GPU_IDS} \
    -v /ai/ai_dxos/volumes/models:/models:ro \
    --shm-size 8g \
    -p {PORT}:{PORT} \
    --name {CONTAINER_NAME} \
    ghcr.io/ggml-org/llama.cpp:server-cuda13 \
    -m /models/{PHYSICAL_MODEL} \
    --port {PORT} \
    --host 0.0.0.0 \
    -c 32768 \
    --n-gpu-layers 99'

LLAMA_CPP_STOP_CMD='docker stop {CONTAINER_NAME} && docker rm {CONTAINER_NAME}'

INFINITY_START_TEMPLATE='docker run -d \
    -v /ai/ai_dxos/volumes/models:/models:ro \
    -p {PORT}:{PORT} \
    --name {CONTAINER_NAME} \
    michaelf34/infinity:0.0.77 \
    infinity_emb v2 --model-id /models/{PHYSICAL_MODEL} --port {PORT}'

INFINITY_STOP_CMD='docker stop {CONTAINER_NAME} && docker rm {CONTAINER_NAME}'

KTRANSFORMERS_START_TEMPLATE='docker run -d \
    --gpus all \
    -v /ai/ai_dxos/volumes/models:/models:ro \
    --shm-size 16g \
    -e CUDA_VISIBLE_DEVICES={GPU_IDS} \
    -p {PORT}:{PORT} \
    --name {CONTAINER_NAME} \
    ktransformers/ktransformers:latest \
    python3 -m ktransformers.server \
    --model-path /models/{PHYSICAL_MODEL} \
    --port {PORT}'

KTRANSFORMERS_STOP_CMD='docker stop {CONTAINER_NAME} && docker rm {CONTAINER_NAME}'

HEALTH_PATH="/health"
WAIT_TIMEOUT_SGLANG=600
WAIT_TIMEOUT_LLAMA=300
WAIT_TIMEOUT_INFINITY=180
WAIT_TIMEOUT_KTRANSFORMERS=600

# ═══════════════════════════════════════════════════════════════
# 网络控制（v6.5 新增）
# ═══════════════════════════════════════════════════════════════

network_status|查看网络状态|curl -s http://127.0.0.1:9983/network/status | python3 -m json.tool
network_probe|立即测速|curl -s "http://127.0.0.1:9983/network/probe" | python3 -m json.tool
proxy_start|启动代理|curl -s -X POST http://127.0.0.1:9983/network/proxy/start
proxy_stop|停止代理|curl -s -X POST http://127.0.0.1:9983/network/proxy/stop
proxy_restart|重启代理|curl -s -X POST http://127.0.0.1:9983/network/proxy/restart
nodes_list|查看所有节点|curl -s http://127.0.0.1:9983/network/nodes | python3 -m json.tool
proxy_logs|查看代理日志|curl -s "http://127.0.0.1:9983/network/proxy/logs?lines=50"
network_config|查看配置|curl -s http://127.0.0.1:9983/network/config | python3 -m json.tool

